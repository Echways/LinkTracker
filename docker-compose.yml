x-kafka-common-env: &kafka-common-env
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_NUM_PARTITIONS: "6"

services:
  postgres:
    image: postgres:17-alpine
    container_name: linktracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: linktracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-1:
    image: apache/kafka:4.2.0
    container_name: linktracker-kafka-1
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-common-env
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9094"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-2:
    image: apache/kafka:4.2.0
    container_name: linktracker-kafka-2
    restart: unless-stopped
    ports:
      - "9095:9095"
    environment:
      <<: *kafka-common-env
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-3:
    image: apache/kafka:4.2.0
    container_name: linktracker-kafka-3
    restart: unless-stopped
    ports:
      - "9096:9096"
    environment:
      <<: *kafka-common-env
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9096"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: linktracker-kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-1:9092 \
          --create \
          --if-not-exists \
          --topic link.processed-updates \
          --partitions 6 \
          --replication-factor 3 \
          --config min.insync.replicas=2
        
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-1:9092 \
          --create \
          --if-not-exists \
          --topic link.raw-updates \
          --partitions 6 \
          --replication-factor 3 \
          --config min.insync.replicas=2

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka-1:9092 \
          --create \
          --if-not-exists \
          --topic link.raw-updates-dlq \
          --partitions 6 \
          --replication-factor 3 \
          --config min.insync.replicas=2
        
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: linktracker-schema-registry
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8071:8071"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8071"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka-1:9092,PLAINTEXT://kafka-2:9092,PLAINTEXT://kafka-3:9092"
      
  valkey-node-1:
    image: valkey/valkey:9.0.3-alpine
    container_name: linktracker-valkey-1
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--port", "6379",
        "--cluster-enabled", "yes",
        "--cluster-config-file", "nodes.conf",
        "--cluster-node-timeout", "5000",
        "--appendonly", "yes",
        "--requirepass", "valkey",
        "--masterauth", "valkey",
        "--cluster-announce-hostname", "valkey-node-1",
        "--cluster-preferred-endpoint-type", "hostname",
        "--protected-mode", "no"
      ]
    ports:
      - "7379:6379"
    volumes:
      - valkey_node_1_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 6379 -a valkey --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey-node-2:
    image: valkey/valkey:9.0.3-alpine
    container_name: linktracker-valkey-2
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--port", "6379",
        "--cluster-enabled", "yes",
        "--cluster-config-file", "nodes.conf",
        "--cluster-node-timeout", "5000",
        "--appendonly", "yes",
        "--requirepass", "valkey",
        "--masterauth", "valkey",
        "--cluster-announce-hostname", "valkey-node-2",
        "--cluster-preferred-endpoint-type", "hostname",
        "--protected-mode", "no"
      ]
    ports:
      - "7380:6379"
    volumes:
      - valkey_node_2_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 6379 -a valkey --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey-node-3:
    image: valkey/valkey:9.0.3-alpine
    container_name: linktracker-valkey-3
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--port", "6379",
        "--cluster-enabled", "yes",
        "--cluster-config-file", "nodes.conf",
        "--cluster-node-timeout", "5000",
        "--appendonly", "yes",
        "--requirepass", "valkey",
        "--masterauth", "valkey",
        "--cluster-announce-hostname", "valkey-node-3",
        "--cluster-preferred-endpoint-type", "hostname",
        "--protected-mode", "no"
      ]
    ports:
      - "7381:6379"
    volumes:
      - valkey_node_3_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -p 6379 -a valkey --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey-cluster-init:
    image: valkey/valkey:9.0.3-alpine
    container_name: linktracker-valkey-cluster-init
    restart: "no"
    depends_on:
      valkey-node-1:
        condition: service_healthy
      valkey-node-2:
        condition: service_healthy
      valkey-node-3:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        AUTH_ARGS="-a valkey --no-auth-warning"
        PORT="6379"
        NODE_1="valkey-node-1"

        cli() {
          valkey-cli -h "$$NODE_1" -p "$$PORT" $$AUTH_ARGS "$$@"
        }

        node_cli() {
          node="$$1"
          shift
          valkey-cli -h "$$node" -p "$$PORT" $$AUTH_ARGS "$$@"
        }

        dump_state() {
          echo "===== CLUSTER INFO ====="
          cli cluster info || true

          echo "===== CLUSTER NODES ====="
          cli cluster nodes || true

          echo "===== CLUSTER SLOTS ====="
          cli cluster slots || true
        }

        wait_for_ping() {
          node="$$1"
          echo "Waiting for $$node to respond to PING..."

          for i in $$(seq 1 60); do
            if node_cli "$$node" ping | grep -q "PONG"; then
              echo "$$node responded PONG"
              return 0
            fi

            echo "$$node is not ready yet, attempt $$i/60"
            sleep 1
          done

          echo "$$node did not respond PONG"
          return 1
        }

        cluster_state_ok() {
          cli cluster info | grep -q "cluster_state:ok"
        }

        cluster_is_fully_ready() {
          info="$$(cli cluster info || true)"
          nodes="$$(cli cluster nodes || true)"

          echo "$$info" | grep -q "cluster_state:ok" || {
            echo "Not ready: cluster_state is not ok"
            return 1
          }

          echo "$$info" | grep -q "cluster_slots_assigned:16384" || {
            echo "Not ready: cluster_slots_assigned is not 16384"
            return 1
          }

          echo "$$info" | grep -q "cluster_slots_ok:16384" || {
            echo "Not ready: cluster_slots_ok is not 16384"
            return 1
          }

          connected_count="$$(echo "$$nodes" | awk '$$0 ~ / connected / { count++ } END { print count + 0 }')"
          if [ "$$connected_count" -ne 3 ]; then
            echo "Not ready: connected node count is $$connected_count, expected 3"
            return 1
          fi

          if echo "$$nodes" | grep -E "fail|handshake|disconnected" > /dev/null; then
            echo "Not ready: cluster nodes contains fail/handshake/disconnected"
            return 1
          fi

          return 0
        }

        routed_probe() {
          key="linktracker:cluster:init:probe:$$(date +%s)"
          echo "Running cluster-routed SET/GET probe with key $$key"
        
          valkey-cli -c -h "$$NODE_1" -p "$$PORT" $$AUTH_ARGS set "$$key" ok > /dev/null 2>&1
          value="$$(valkey-cli -c --raw -h "$$NODE_1" -p "$$PORT" $$AUTH_ARGS get "$$key" 2>/dev/null | tail -1)"

          if [ "$$value" != "ok" ]; then
            echo "Probe failed: expected 'ok', got '$$value'"
            return 1
          fi

          valkey-cli -c -h "$$NODE_1" -p "$$PORT" $$AUTH_ARGS del "$$key" > /dev/null 2>&1
          echo "Cluster-routed SET/GET probe succeeded"
          return 0
        }

        wait_for_cluster_ready() {
          echo "Waiting for Valkey cluster to become fully ready..."

          for i in $$(seq 1 90); do
            echo "Readiness attempt $$i/90"

            if cluster_is_fully_ready; then
              if routed_probe; then
                echo "Valkey cluster is fully ready"
                return 0
              fi
            fi

            if [ "$$i" = "1" ] || [ "$$i" = "10" ] || [ "$$i" = "30" ] || [ "$$i" = "60" ] || [ "$$i" = "90" ]; then
              dump_state
            fi

            sleep 1
          done

          echo "Valkey cluster failed to become fully ready"
          dump_state
          return 1
        }

        wait_for_ping valkey-node-1
        wait_for_ping valkey-node-2
        wait_for_ping valkey-node-3

        echo "Checking existing Valkey cluster..."

        sleep 5

        if cluster_state_ok; then
          echo "Cluster already initialized and healthy, waiting for full readiness..."
          wait_for_cluster_ready
          exit 0
        fi
        
        existing_slots=$$(cli cluster info 2>/dev/null \
          | grep 'cluster_slots_assigned' \
          | cut -d: -f2 \
          | tr -d '[:space:]' \
          || echo 0)

        if [ "$${existing_slots:-0}" -gt 0 ] 2>/dev/null; then
          echo "Nodes have existing cluster data (slots_assigned=$${existing_slots}), cluster is recovering — waiting..."
          wait_for_cluster_ready
          exit 0
        fi

        echo "Creating Valkey cluster..."

        echo "yes" | valkey-cli \
          -h "$$NODE_1" \
          -p "$$PORT" \
          $$AUTH_ARGS \
          --cluster create \
          valkey-node-1:6379 \
          valkey-node-2:6379 \
          valkey-node-3:6379 \
          --cluster-replicas 0

        wait_for_cluster_ready

        echo "Valkey cluster initialized successfully"
  redis-insight:
    image: redis/redisinsight:latest
    container_name: linktracker-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      valkey-cluster-init:
        condition: service_completed_successfully

  grafana:
    image: grafana/grafana-oss:latest
    container_name: linktracker-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
  
  pushgateway:
    image: prom/pushgateway:latest
    container_name: linktracker-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
  
  prometheus:
    image: prom/prometheus:latest
    container_name: linktracker-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - pushgateway

volumes:
  postgres_data:
  valkey_node_1_data:
  valkey_node_2_data:
  valkey_node_3_data:
  redis_insight_data:
  prometheus_data:
  grafana_data: