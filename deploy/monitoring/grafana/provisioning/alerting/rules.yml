apiVersion: 1

groups:
  - orgId: 1
    name: memory
    folder: LinkTracker
    interval: 1m
    rules:
      - uid: ram_high_usage
        title: High process memory usage
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Высокое потребление RAM сервисом {{ $labels.job }}"
          description: "process_memory_working_set_bytes превысил 500 MB (instance {{ $labels.instance }}, job {{ $labels.job }})"
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: max by (job, instance) (process_memory_working_set_bytes{job=~"scrapper|bot|aiagent"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 524288000

  - orgId: 1
    name: kafka
    folder: LinkTracker
    interval: 1m
    rules:
      - uid: kafka_dlq_publish_failed
        title: Kafka DLQ is unavailable
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} не может писать в DLQ (topic {{ $labels.topic }})"
          description: >-
            kafka_dead_letter_errors_total растет: отправка в DLQ падает, offset не коммитится,
            и «ядовитое» сообщение переигрывается бесконечно. Проверь, что DLQ-топик существует
            (kafka-init) и что DeadLetterTopic в конфиге сервиса совпадает с ним.
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum by (job, topic) (increase(kafka_dead_letter_errors_total{job=~"bot|aiagent"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0

      - uid: kafka_dlq_growth
        title: Kafka DLQ is filling up
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Сообщения уходят в DLQ у {{ $labels.job }} (topic {{ $labels.topic }})"
          description: "kafka_dead_letter_total растет: сообщения не проходят десериализацию, валидацию или обработку."
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              editorMode: code
              expr: sum by (job, topic) (increase(kafka_dead_letter_total{job=~"bot|aiagent"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params:
                      - 0